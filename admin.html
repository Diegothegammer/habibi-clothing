<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - HABIBI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; --gray: #1f1f1f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
    header {
      background: rgba(10,10,10,0.97); padding: 14px 16px; border-bottom: 1px solid #333;
      position: sticky; top: 0; z-index: 50;
    }
    .nav {
      max-width: 960px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: 2px; text-decoration: none; color: white; }
    .nav a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.85; margin-left: 14px; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 60px; }
    .denied, .loading { text-align: center; padding: 60px 20px; opacity: 0.75; }
    .denied a { color: #ffd78a; }
    h1 { font-size: 1.7rem; margin-bottom: 6px; }
    .sub { opacity: 0.55; font-size: 0.9rem; margin-bottom: 20px; }

    .main-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .main-tab {
      padding: 10px 18px; border-radius: 50px; border: 1px solid #444;
      background: transparent; color: white; font-family: inherit; font-size: 0.9rem; cursor: pointer;
    }
    .main-tab.active { background: white; color: black; border-color: white; }

    .panel { display: none; }
    .panel.show { display: block; }

    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
    .stats-row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--gray); border-radius: 12px; padding: 16px; text-align: center; }
    .stat.revenue { grid-column: 1 / -1; background: linear-gradient(135deg, #1a2e1a, #1f1f1f); border: 1px solid #2d5a2d; }
    .stat .n { font-size: 1.5rem; font-weight: 600; }
    .stat.revenue .n { font-size: 1.8rem; color: #6bffb0; }
    .stat .l { font-size: 0.75rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      padding: 8px 16px; border-radius: 50px; border: 1px solid #444;
      background: transparent; color: white; font-family: inherit; font-size: 0.85rem; cursor: pointer;
    }
    .tab.active { background: white; color: black; border-color: white; }

    .order {
      background: var(--gray); border-radius: 14px; padding: 18px; margin-bottom: 14px;
      border-left: 4px solid #666;
    }
    .order.pending { border-left-color: #e6a817; }
    .order.completed { border-left-color: #2ecc71; }
    .order.refunded { border-left-color: #ff6b7a; }
    .order-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .badge {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 4px 10px; border-radius: 50px; font-weight: 600;
    }
    .badge.pending { background: #3d3210; color: #ffd76a; }
    .badge.completed { background: #0f2e1a; color: #6bffb0; }
    .badge.refunded { background: #3d1518; color: #ff8a95; }
    .order-id { font-size: 0.8rem; opacity: 0.5; margin-top: 8px; }
    .order-total { font-size: 1.2rem; font-weight: 600; }
    .order-date { font-size: 0.85rem; opacity: 0.65; margin-bottom: 10px; }
    .ship, .items { font-size: 0.9rem; line-height: 1.55; margin-bottom: 10px; }
    .ship strong, .items strong {
      opacity: 0.55; font-weight: 500; display: block; margin-bottom: 2px;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .order-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn {
      padding: 10px 18px; border-radius: 50px; border: none;
      font-family: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }
    .btn-done { background: #2ecc71; color: #000; }
    .btn-pending { background: transparent; color: #ffd76a; border: 1px solid #665518; }
    .btn-refund { background: transparent; color: #ff8a95; border: 1px solid #663038; }
    .btn-primary { background: white; color: black; }
    .btn-danger { background: transparent; color: #ff6b7a; border: 1px solid #663038; }
    .btn-ghost { background: transparent; color: white; border: 1px solid #555; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty { text-align: center; padding: 40px 16px; opacity: 0.5; }

    /* Products */
    .prod-form {
      background: var(--gray); border-radius: 14px; padding: 20px; margin-bottom: 24px;
    }
    .prod-form h2 { font-size: 1.1rem; margin-bottom: 14px; }
    .prod-form label { display: block; font-size: 0.8rem; opacity: 0.6; margin: 10px 0 4px; }
    .prod-form input, .prod-form select {
      width: 100%; padding: 12px 14px; background: #111; border: 1px solid #444;
      color: white; border-radius: 10px; font-family: inherit; font-size: 0.95rem;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .prod-card {
      background: var(--gray); border-radius: 14px; padding: 14px; margin-bottom: 12px;
      display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: start;
    }
    .prod-card img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 10px; background: #222;
    }
    .prod-card h3 { font-size: 1rem; margin-bottom: 4px; }
    .prod-meta { font-size: 0.85rem; opacity: 0.7; line-height: 1.45; }
    .prod-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .stock-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .stock-row input {
      width: 80px; padding: 8px; background: #111; border: 1px solid #444;
      color: white; border-radius: 8px; font-family: inherit;
    }

    @media (max-width: 600px) {
      .stats, .stats-row2, .form-row { grid-template-columns: 1fr; }
      .stat.revenue { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a href="index.html" class="logo">HABIBI</a>
      <div>
        <a href="profile.html">Profile</a>
        <a href="shop.html">Shop</a>
      </div>
    </div>
  </header>

  <div class="wrap" id="root">
    <p class="loading">Checking access...</p>
  </div>

  <script type="module">
    import {
      auth,
      onAuthStateChanged,
      isAdminEmail,
      getAllOrders,
      updateOrderStatus,
      getAllProducts,
      saveProduct,
      deleteProduct,
      setProductStock,
      seedProductsIfEmpty,
      ADMIN_EMAIL
    } from "./js/firebase.js";

    const root = document.getElementById("root");
    let allOrders = [];
    let allProducts = [];
    let orderFilter = "pending";
    let mainTab = "orders"; // orders | products
    let editingId = null;

    function formatDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("en-ZA", {
        day: "numeric", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function statusOf(o) {
      return o.status || "pending";
    }

    function actionButtons(o) {
      const st = statusOf(o);
      const key = o._key;
      const parts = [];
      if (st !== "completed") parts.push(`<button class="btn btn-done" data-key="${key}" data-action="completed">Completed</button>`);
      if (st !== "pending") parts.push(`<button class="btn btn-pending" data-key="${key}" data-action="pending">Pending</button>`);
      if (st !== "refunded") parts.push(`<button class="btn btn-refund" data-key="${key}" data-action="refunded">Refunded</button>`);
      return parts.join("");
    }

    function renderShell() {
      root.innerHTML = `
        <h1>Admin</h1>
        <p class="sub">${ADMIN_EMAIL}</p>
        <div class="main-tabs">
          <button class="main-tab ${mainTab === "orders" ? "active" : ""}" data-main="orders">Orders</button>
          <button class="main-tab ${mainTab === "products" ? "active" : ""}" data-main="products">Products & Stock</button>
        </div>
        <div id="panelOrders" class="panel ${mainTab === "orders" ? "show" : ""}"></div>
        <div id="panelProducts" class="panel ${mainTab === "products" ? "show" : ""}"></div>
      `;

      root.querySelectorAll("[data-main]").forEach((btn) => {
        btn.addEventListener("click", () => {
          mainTab = btn.dataset.main;
          renderShell();
          if (mainTab === "orders") renderOrders();
          else renderProducts();
        });
      });

      if (mainTab === "orders") renderOrders();
      else renderProducts();
    }

    function renderOrders() {
      const panel = document.getElementById("panelOrders");
      if (!panel) return;

      const pending = allOrders.filter((o) => statusOf(o) === "pending");
      const completed = allOrders.filter((o) => statusOf(o) === "completed");
      const refunded = allOrders.filter((o) => statusOf(o) === "refunded");
      const revenue = completed.reduce((s, o) => s + (Number(o.total) || 0), 0);

      let list = allOrders;
      if (orderFilter === "pending") list = pending;
      if (orderFilter === "completed") list = completed;
      if (orderFilter === "refunded") list = refunded;

      let cards = list.length === 0
        ? `<p class="empty">No ${orderFilter === "all" ? "" : orderFilter + " "}orders.</p>`
        : list.map((o) => {
            const st = statusOf(o);
            const s = o.shipping || {};
            const items = (o.items || [])
              .map((i) => {
                const extra = [i.color, i.qty ? "x" + i.qty : null].filter(Boolean).join(" · ");
                return `${i.name}${extra ? " (" + extra + ")" : ""} — R${(i.price || 0) * (i.qty || 1)}`;
              })
              .join("<br>");
            const shipFee = o.shippingFee != null ? o.shippingFee : null;
            return `
              <div class="order ${st}">
                <div class="order-head">
                  <div>
                    <span class="badge ${st}">${st}</span>
                    <div class="order-id">#${o.id || o._key}</div>
                  </div>
                  <div class="order-total">R${o.total || 0}</div>
                </div>
                <div class="order-date">${formatDate(o.createdAt)}${shipFee != null ? " · Shipping R" + shipFee : ""}</div>
                <div class="ship">
                  <strong>Customer</strong>
                  ${s.name || "—"}<br>${s.phone || ""}<br>${s.email || o.userEmail || ""}<br>
                  ${[s.address, s.city, s.province, s.postal].filter(Boolean).join(", ")}
                </div>
                <div class="items"><strong>Items</strong>${items || "—"}</div>
                <div class="order-actions">${actionButtons(o)}</div>
              </div>`;
          }).join("");

      panel.innerHTML = `
        <div class="stats">
          <div class="stat"><div class="n">${pending.length}</div><div class="l">Pending</div></div>
          <div class="stat"><div class="n">${completed.length}</div><div class="l">Completed</div></div>
        </div>
        <div class="stats-row2">
          <div class="stat"><div class="n">${refunded.length}</div><div class="l">Refunded</div></div>
          <div class="stat"><div class="n">${allOrders.length}</div><div class="l">All orders</div></div>
        </div>
        <div class="stats" style="margin-bottom:20px">
          <div class="stat revenue"><div class="n">R${revenue}</div><div class="l">Total from completed orders</div></div>
        </div>
        <div class="tabs">
          <button class="tab ${orderFilter === "pending" ? "active" : ""}" data-filter="pending">Pending</button>
          <button class="tab ${orderFilter === "completed" ? "active" : ""}" data-filter="completed">Completed</button>
          <button class="tab ${orderFilter === "refunded" ? "active" : ""}" data-filter="refunded">Refunded</button>
          <button class="tab ${orderFilter === "all" ? "active" : ""}" data-filter="all">All</button>
          <button class="tab" id="refreshOrders" style="margin-left:auto">Refresh</button>
        </div>
        ${cards}
      `;

      panel.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          orderFilter = btn.dataset.filter;
          renderOrders();
        });
      });
      document.getElementById("refreshOrders")?.addEventListener("click", () => loadOrders(true));

      panel.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await updateOrderStatus(btn.dataset.key, btn.dataset.action);
            await loadOrders(false);
          } catch (err) {
            alert("Update failed: " + (err.message || err));
            btn.disabled = false;
          }
        });
      });
    }

    function renderProducts() {
      const panel = document.getElementById("panelProducts");
      if (!panel) return;

      const edit = editingId
        ? allProducts.find((p) => p.id === editingId)
        : null;

      panel.innerHTML = `
        <div class="prod-form">
          <h2>${edit ? "Edit product" : "Add product"}</h2>
          <label>Name</label>
          <input type="text" id="pName" value="${edit ? edit.name : ""}" placeholder="e.g. Habibi Fresh Cap">
          <div class="form-row">
            <div>
              <label>Price (R)</label>
              <input type="number" id="pPrice" min="0" value="${edit ? edit.price : ""}" placeholder="449">
            </div>
            <div>
              <label>Stock</label>
              <input type="number" id="pStock" min="0" value="${edit ? edit.stock : "10"}" placeholder="10">
            </div>
          </div>
          <label>Category</label>
          <select id="pCategory">
            <option value="hats" ${edit?.category === "hats" ? "selected" : ""}>Hats</option>
            <option value="tshirts" ${!edit || edit?.category === "tshirts" ? "selected" : ""}>T-Shirts</option>
            <option value="hoodies" ${edit?.category === "hoodies" ? "selected" : ""}>Hoodies & Outerwear</option>
            <option value="pants" ${edit?.category === "pants" ? "selected" : ""}>Pants</option>
          </select>
          <label>Image URL (link to photo)</label>
          <input type="url" id="pImg" value="${edit ? edit.img || "" : ""}" placeholder="https://...jpg">
          <div class="form-actions">
            <button class="btn btn-primary" id="saveProductBtn">${edit ? "Save changes" : "Add product"}</button>
            ${edit ? '<button class="btn btn-ghost" id="cancelEditBtn">Cancel</button>' : ""}
          </div>
        </div>

        <div class="tabs">
          <span style="opacity:0.6;font-size:0.9rem;align-self:center">${allProducts.length} products</span>
          <button class="tab" id="refreshProducts" style="margin-left:auto">Refresh</button>
        </div>

        <div id="prodList">
          ${allProducts.length === 0
            ? '<p class="empty">No products yet. Add one above.</p>'
            : allProducts.map((p) => `
              <div class="prod-card">
                <img src="${p.img || ""}" alt="" onerror="this.style.opacity=0.3">
                <div>
                  <h3>${p.name}</h3>
                  <div class="prod-meta">
                    R${p.price} · ${(p.category || "").toUpperCase()} ·
                    Stock: <strong style="opacity:1;display:inline">${p.stock ?? 0}</strong>
                    ${p.active === false ? " · <span style='color:#ff8a95'>Hidden</span>" : ""}
                  </div>
                  <div class="stock-row">
                    <input type="number" min="0" value="${p.stock ?? 0}" data-stock-id="${p.id}">
                    <button class="btn btn-ghost" data-set-stock="${p.id}">Update stock</button>
                  </div>
                  <div class="prod-actions">
                    <button class="btn btn-ghost" data-edit="${p.id}">Edit</button>
                    <button class="btn btn-danger" data-del="${p.id}">Delete</button>
                  </div>
                </div>
              </div>`).join("")}
        </div>
      `;

      document.getElementById("saveProductBtn").addEventListener("click", async () => {
        const name = document.getElementById("pName").value.trim();
        const price = document.getElementById("pPrice").value;
        const stock = document.getElementById("pStock").value;
        const category = document.getElementById("pCategory").value;
        const img = document.getElementById("pImg").value.trim();
        if (!name) return alert("Name is required");
        if (!img) return alert("Image URL is required");
        const btn = document.getElementById("saveProductBtn");
        btn.disabled = true;
        btn.textContent = "Saving...";
        try {
          await saveProduct(editingId, { name, price, stock, category, img, active: true });
          editingId = null;
          await loadProducts();
        } catch (err) {
          alert("Save failed: " + (err.message || err));
          btn.disabled = false;
        }
      });

      document.getElementById("cancelEditBtn")?.addEventListener("click", () => {
        editingId = null;
        renderProducts();
      });

      document.getElementById("refreshProducts")?.addEventListener("click", () => loadProducts());

      panel.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          editingId = btn.dataset.edit;
          renderProducts();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      panel.querySelectorAll("[data-del]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this product?")) return;
          try {
            await deleteProduct(btn.dataset.del);
            if (editingId === btn.dataset.del) editingId = null;
            await loadProducts();
          } catch (err) {
            alert("Delete failed: " + (err.message || err));
          }
        });
      });

      panel.querySelectorAll("[data-set-stock]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.setStock;
          const input = panel.querySelector(`input[data-stock-id="${id}"]`);
          btn.disabled = true;
          try {
            await setProductStock(id, input.value);
            await loadProducts();
          } catch (err) {
            alert("Stock update failed: " + (err.message || err));
            btn.disabled = false;
          }
        });
      });
    }

    async function loadOrders(showLoading) {
      if (showLoading && mainTab === "orders") {
        document.getElementById("panelOrders").innerHTML = '<p class="loading">Loading orders...</p>';
      }
      allOrders = await getAllOrders();
      if (mainTab === "orders") renderOrders();
    }

    async function loadProducts() {
      try {
        await seedProductsIfEmpty();
        allProducts = await getAllProducts();
        if (mainTab === "products") renderProducts();
      } catch (err) {
        document.getElementById("panelProducts").innerHTML =
          '<p class="empty">Could not load products. Update Firebase rules for products.<br>' +
          (err.message || "") + "</p>";
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        root.innerHTML = `<div class="denied"><p>You must be logged in.</p><p style="margin-top:12px"><a href="login.html">Login</a></p></div>`;
        return;
      }
      if (!isAdminEmail(user.email)) {
        root.innerHTML = `<div class="denied"><p>Access denied.</p><p style="margin-top:16px"><a href="index.html">Back to shop</a></p></div>`;
        return;
      }

      renderShell();
      try {
        await Promise.all([loadOrders(false), loadProducts()]);
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
