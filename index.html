<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABIBI CLOTHING</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; --gray: #1f1f1f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--black); color: var(--white); overflow-x: hidden; }
    header {
      background: rgba(10,10,10,0.97); backdrop-filter: blur(12px);
      padding: 14px 16px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333;
    }
    .nav-container {
      max-width: 1300px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 5vw, 2.3rem); letter-spacing: 2px; white-space: nowrap; }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .cart-link { color: white; font-size: 1.35rem; position: relative; text-decoration: none; padding: 6px; }
    #cart-count {
      position: absolute; top: -4px; right: -6px; background: #c41e3a; color: white;
      font-size: 0.7rem; min-width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: 700; padding: 0 4px;
    }
    .account-link { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
    .hamburger { display: none; font-size: 1.6rem; cursor: pointer; color: white; background: none; border: none; padding: 8px; line-height: 1; }
    .hero {
      min-height: 85vh;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a26?w=2000') center/cover;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;
    }
    .hero-content h1 { font-size: clamp(2.8rem, 12vw, 7rem); letter-spacing: clamp(2px, 1.5vw, 8px); line-height: 1.1; }
    .hero-content p { font-size: clamp(1rem, 3.5vw, 1.5rem); margin: 16px 0 32px; opacity: 0.9; }
    .btn {
      display: inline-block; background: transparent; color: white; padding: 14px 36px;
      border: 2px solid white; border-radius: 50px; font-size: 1rem; text-decoration: none;
    }
    .section { padding: 60px 16px; max-width: 1300px; margin: 0 auto; }
    h2 { font-size: clamp(1.8rem, 6vw, 3rem); text-align: center; margin-bottom: 36px; letter-spacing: 2px; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .product-card { background: var(--gray); border-radius: 14px; overflow: hidden; }
    .product-card img { width: 100%; height: 280px; object-fit: cover; display: block; }
    .info { padding: 16px; text-align: center; }
    .info h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .price { font-size: 1.35rem; font-weight: 600; margin: 8px 0 14px; }
    .add-btn {
      width: 100%; background: white; color: black; padding: 12px; border: none;
      border-radius: 50px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .mobile-menu {
      display: none; position: fixed; top: 57px; left: 0; width: 100%; background: #141414;
      padding: 24px 20px 32px; flex-direction: column; gap: 8px; z-index: 999; border-top: 1px solid #333;
    }
    .mobile-menu a { color: white; text-decoration: none; font-size: 1.15rem; padding: 14px 12px; border-radius: 10px; }
    footer { background: #000; text-align: center; padding: 48px 20px; }
    @media (max-width: 768px) {
      .nav-links, .account-link { display: none; }
      .hamburger { display: block; }
      .products { grid-template-columns: 1fr 1fr; gap: 12px; }
      .product-card img { height: 200px; }
      .hero { min-height: 75vh; }
    }
    @media (max-width: 420px) { .products { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">HABIBI</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-right">
        <a href="login.html" id="accountLink" class="account-link">Login</a>
        <a href="cart.html" class="cart-link">🛒<span id="cart-count">0</span></a>
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart</a>
      <a href="login.html" id="mobileAccountLink">Login</a>
    </div>
  </header>

  <div class="hero">
    <div class="hero-content">
      <h1>HABIBI</h1>
      <p>Desert Luxury • Street Royalty</p>
      <a href="shop.html" class="btn">Shop The Collection</a>
    </div>
  </div>

  <div class="section">
    <h2>Featured Drops</h2>
    <div class="products">
      <div class="product-card">
        <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg" alt="Habibi Fresh Cap">
        <div class="info">
          <h3>Habibi Fresh Cap</h3>
          <p class="price">R899</p>
          <button class="add-btn" onclick="addToCart(1,'Habibi Fresh Cap',899,'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg')">Add to Cart</button>
        </div>
      </div>
      <div class="product-card">
        <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg" alt="Signature Logo Tee">
        <div class="info">
          <h3>Signature Logo Tee</h3>
          <p class="price">R449</p>
          <button class="add-btn" onclick="addToCart(2,'Signature Logo Tee',449,'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg')">Add to Cart</button>
        </div>
      </div>
      <div class="product-card">
        <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa8205110098.48449366_4Vjsh.jpg" alt="Habibi Signature Hoodie">
        <div class="info">
          <h3>Habibi Signature Hoodie</h3>
          <p class="price">R1499</p>
          <button class="add-btn" onclick="addToCart(3,'Habibi Signature Hoodie',1499,'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa8205110098.48449366_4Vjsh.jpg')">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p style="font-size:1.5rem;margin-bottom:6px">HABIBI CLOTHING</p>
    <p>Pretoria Streetwear</p>
    <p style="margin-top:28px;font-size:0.85rem;opacity:0.55">© 2026 Habibi Clothing</p>
  </footer>

  <script src="js/cart-modal.js"></script>
  <script type="module">
    import { auth, onAuthStateChanged } from "./js/firebase.js";
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      const isOpen = mobileMenu.style.display === 'flex';
      mobileMenu.style.display = isOpen ? 'none' : 'flex';
      hamburger.textContent = isOpen ? '☰' : '✕';
    });
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => { mobileMenu.style.display = 'none'; hamburger.textContent = '☰'; });
    });
    onAuthStateChanged(auth, (user) => {
      const href = user ? 'profile.html' : 'login.html';
      const text = user ? 'My Account' : 'Login';
      ['accountLink', 'mobileAccountLink'].forEach(id => {
        const a = document.getElementById(id);
        if (a) { a.href = href; a.textContent = text; }
      });
    });
  </script>
</body>
</html>
