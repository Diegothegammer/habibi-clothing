<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HABIBI CLOTHING</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
    header { background: rgba(10,10,10,0.97); padding: 14px 16px; border-bottom: 1px solid #333; }
    .nav-container { max-width: 500px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; letter-spacing: 2px; text-decoration: none; color: white; }
    .nav-container a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.85; }
    .wrap { max-width: 400px; margin: 60px auto; padding: 0 16px; }
    h1 { font-size: 1.8rem; margin-bottom: 6px; letter-spacing: 1px; }
    .sub { opacity: 0.65; margin-bottom: 24px; font-size: 0.95rem; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.8rem; opacity: 0.7; margin-bottom: -4px; }
    input {
      padding: 14px 16px; background: #111; border: 1px solid #444; color: white;
      border-radius: 10px; font-size: 1rem; font-family: inherit; width: 100%;
    }
    input::placeholder { color: #777; }
    .btn {
      margin-top: 8px; padding: 15px; background: white; color: black; border: none;
      border-radius: 50px; font-size: 1.05rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 0.9rem; text-align: center; color: #ff6b7a; }
    .switch { text-align: center; margin-top: 22px; font-size: 0.95rem; opacity: 0.8; }
    .switch a { color: white; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">HABIBI</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </header>

  <div class="wrap">
    <h1>Welcome Back</h1>
    <p class="sub">Login to see your orders & checkout faster</p>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required placeholder="you@email.com" autocomplete="email">
      <label>Password</label>
      <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
      <button type="submit" class="btn" id="submitBtn">Login</button>
    </form>

    <p class="msg" id="msg"></p>
    <p class="switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>

  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "./js/firebase.js";

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "profile.html";
    });

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "profile.html";
      } catch (err) {
        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
          msg.textContent = "Invalid email or password.";
        } else if (err.code === "auth/too-many-requests") {
          msg.textContent = "Too many attempts. Try again later.";
        } else {
          msg.textContent = err.message || "Login failed. Try again.";
        }
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
