<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - HABIBI CLOTHING</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; --gray: #1f1f1f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--black); color: var(--white); overflow-x: hidden; }

    header {
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #333;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.95rem; }

    .nav-right { display: flex; align-items: center; gap: 16px; }

    .cart-link {
      color: white;
      font-size: 1.35rem;
      position: relative;
      text-decoration: none;
      padding: 6px;
    }

    #cart-count {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #c41e3a;
      color: white;
      font-size: 0.7rem;
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      padding: 0 4px;
    }

    .hamburger {
      display: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: white;
      background: none;
      border: none;
      padding: 8px;
      line-height: 1;
    }

    .section { padding: 48px 16px 60px; max-width: 1300px; margin: 0 auto; }
    h2 {
      text-align: center;
      font-size: clamp(1.8rem, 6vw, 3rem);
      margin-bottom: 36px;
      letter-spacing: 2px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--gray);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.3s;
    }
    .product-card:hover { transform: translateY(-8px); }
    .product-card img { width: 100%; height: 280px; object-fit: cover; display: block; }
    .info { padding: 16px; text-align: center; }
    .info h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .price { font-size: 1.35rem; font-weight: 600; margin: 8px 0 14px; }

    .add-btn {
      width: 100%;
      background: white;
      color: black;
      padding: 12px;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .add-btn:active { transform: scale(0.97); }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 57px;
      left: 0;
      width: 100%;
      background: #141414;
      padding: 24px 20px 32px;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
      border-top: 1px solid #333;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .mobile-menu a {
      color: white;
      text-decoration: none;
      font-size: 1.15rem;
      padding: 14px 12px;
      border-radius: 10px;
      font-weight: 500;
    }
    .mobile-menu a:active { background: #222; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .products { grid-template-columns: 1fr 1fr; gap: 12px; }
      .product-card img { height: 200px; }
      .info { padding: 12px 10px; }
      .info h3 { font-size: 0.9rem; }
      .price { font-size: 1.1rem; margin: 6px 0 10px; }
      .add-btn { padding: 10px; font-size: 0.85rem; }
    }

    @media (max-width: 420px) {
      .products { grid-template-columns: 1fr; gap: 16px; }
      .product-card img { height: 260px; }
      .info h3 { font-size: 1rem; }
      .price { font-size: 1.25rem; }
      .add-btn { padding: 12px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">HABIBI</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="cart-link">
          🛒
          <span id="cart-count">0</span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <div class="section">
    <h2>All Products</h2>
    <div class="products">
      <div class="product-card">
        <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg" alt="Habibi Fresh Cap">
        <div class="info">
          <h3>Habibi Fresh Cap</h3>
          <p class="price">R899</p>
          <button class="add-btn" onclick="addToCart(1, 'Habibi Fresh Cap', 899, 'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg')">Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg" alt="Signature Logo Tee">
        <div class="info">
          <h3>Signature Logo Tee</h3>
          <p class="price">R449</p>
          <button class="add-btn" onclick="addToCart(2, 'Signature Logo Tee', 449, 'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg')">Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800" alt="Emirates Bomber Jacket">
        <div class="info">
          <h3>Emirates Bomber Jacket</h3>
          <p class="price">R1499</p>
          <button class="add-btn" onclick="addToCart(3, 'Emirates Bomber Jacket', 1499, 'https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800')">Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800" alt="Sahara Cargo Pants">
        <div class="info">
          <h3>Sahara Cargo Pants</h3>
          <p class="price">R799</p>
          <button class="add-btn" onclick="addToCart(4, 'Sahara Cargo Pants', 799, 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800')">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      const isOpen = mobileMenu.style.display === 'flex';
      mobileMenu.style.display = isOpen ? 'none' : 'flex';
      hamburger.textContent = isOpen ? '☰' : '✕';
    });

    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.style.display = 'none';
        hamburger.textContent = '☰';
      });
    });

    function addToCart(id, name, price, img) {
      let cart = JSON.parse(localStorage.getItem('habibiCart')) || [];
      cart.push({ id, name, price, img });
      localStorage.setItem('habibiCart', JSON.stringify(cart));
      alert(`${name} added to cart!`);
      updateCartCount();
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('habibiCart')) || [];
      document.getElementById('cart-count').textContent = cart.length;
    }

    window.onload = updateCartCount;
  </script>
</body>
</html>
