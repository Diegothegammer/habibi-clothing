<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - HABIBI CLOTHING</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; --gray: #1f1f1f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--black); color: var(--white); overflow-x: hidden; }

    header {
      background: rgba(10,10,10,0.97); backdrop-filter: blur(12px);
      padding: 14px 16px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333;
    }
    .nav-container {
      max-width: 1300px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 5vw, 2.3rem); letter-spacing: 2px; white-space: nowrap; }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .cart-link { color: white; font-size: 1.35rem; position: relative; text-decoration: none; padding: 6px; }
    #cart-count {
      position: absolute; top: -4px; right: -6px; background: #c41e3a; color: white;
      font-size: 0.7rem; min-width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: 700; padding: 0 4px;
    }
    .hamburger { display: none; font-size: 1.6rem; cursor: pointer; color: white; background: none; border: none; padding: 8px; line-height: 1; }

    .section { padding: 32px 20px 70px; max-width: 1200px; margin: 0 auto; }
    .shop-header { margin-bottom: 20px; }
    .shop-header h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: 2px; font-weight: 600; margin-bottom: 6px; }
    .product-count { font-size: 0.9rem; opacity: 0.55; }

    .cat-nav {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 40px;
      position: sticky; top: 58px; z-index: 50;
      background: rgba(10,10,10,0.92); backdrop-filter: blur(10px);
      padding: 12px 0; border-bottom: 1px solid #222;
    }
    .cat-nav a {
      color: white; text-decoration: none; font-size: 0.85rem; font-weight: 500;
      padding: 8px 16px; border: 1px solid #444; border-radius: 50px; white-space: nowrap;
    }
    .cat-nav a:hover, .cat-nav a:active { background: white; color: black; border-color: white; }

    .category { margin-bottom: 56px; scroll-margin-top: 120px; }
    .category-title { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .category-title h2 {
      font-size: clamp(1.25rem, 3.5vw, 1.6rem); font-weight: 600;
      letter-spacing: 3px; text-transform: uppercase; white-space: nowrap;
    }
    .category-title .line { flex: 1; height: 1px; background: linear-gradient(to right, #444, transparent); }

    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .product-card {
      background: var(--gray); border-radius: 12px; overflow: hidden;
      position: relative; transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .product-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.45); }
    .img-wrap { position: relative; overflow: hidden; aspect-ratio: 3 / 4; background: #151515; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .product-card:hover .img-wrap img { transform: scale(1.06); }
    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: flex-end; justify-content: center; padding: 20px;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .product-card:hover .overlay { opacity: 1; }
    .overlay .add-btn {
      width: 100%; max-width: 200px; background: white; color: black; padding: 13px 16px;
      border: none; border-radius: 50px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
    }
    .info { padding: 16px 14px 18px; text-align: left; }
    .info h3 { font-size: 1rem; font-weight: 500; margin-bottom: 6px; line-height: 1.3; }
    .price { font-size: 1.15rem; font-weight: 600; }
    .mobile-add {
      display: none; width: 100%; background: white; color: black; padding: 12px;
      border: none; border-radius: 50px; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 12px;
    }

    .mobile-menu {
      display: none; position: fixed; top: 57px; left: 0; width: 100%; background: #141414;
      padding: 24px 20px 32px; flex-direction: column; gap: 8px; z-index: 999;
      border-top: 1px solid #333; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .mobile-menu a { color: white; text-decoration: none; font-size: 1.15rem; padding: 14px 12px; border-radius: 10px; font-weight: 500; }

    @media (max-width: 900px) { .products { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .section { padding: 24px 14px 50px; }
      .cat-nav { top: 57px; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
      .cat-nav::-webkit-scrollbar { display: none; }
      .products { grid-template-columns: 1fr; gap: 24px; }
      .product-card:hover { transform: none; box-shadow: none; }
      .overlay { display: none; }
      .info { display: flex; flex-direction: column; }
      .info-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .mobile-add { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">HABIBI</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="cart-link">🛒<span id="cart-count">0</span></a>
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <div class="section">
    <div class="shop-header">
      <h1>Shop</h1>
      <span class="product-count">4 products</span>
    </div>
    <nav class="cat-nav">
      <a href="#hats">Hats</a>
      <a href="#tshirts">T-Shirts</a>
      <a href="#hoodies">Hoodies</a>
      <a href="#pants">Pants</a>
    </nav>

    <section class="category" id="hats">
      <div class="category-title"><h2>Hats</h2><div class="line"></div></div>
      <div class="products">
        <div class="product-card">
          <div class="img-wrap">
            <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg" alt="Habibi Fresh Cap">
            <div class="overlay">
              <button class="add-btn" onclick="addToCart(1,'Habibi Fresh Cap',899,'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg')">Add to Cart</button>
            </div>
          </div>
          <div class="info">
            <div class="info-top"><h3>Habibi Fresh Cap</h3><p class="price">R899</p></div>
            <button class="mobile-add" onclick="addToCart(1,'Habibi Fresh Cap',899,'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg')">Add to Cart</button>
          </div>
        </div>
      </div>
    </section>

    <section class="category" id="tshirts">
      <div class="category-title"><h2>T-Shirts</h2><div class="line"></div></div>
      <div class="products">
        <div class="product-card">
          <div class="img-wrap">
            <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg" alt="Signature Logo Tee">
            <div class="overlay">
              <button class="add-btn" onclick="addToCart(2,'Signature Logo Tee',449,'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg')">Add to Cart</button>
            </div>
          </div>
          <div class="info">
            <div class="info-top"><h3>Signature Logo Tee</h3><p class="price">R449</p></div>
            <button class="mobile-add" onclick="addToCart(2,'Signature Logo Tee',449,'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg')">Add to Cart</button>
          </div>
        </div>
      </div>
    </section>

    <section class="category" id="hoodies">
      <div class="category-title"><h2>Hoodies &amp; Outerwear</h2><div class="line"></div></div>
      <div class="products">
        <div class="product-card">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800" alt="Emirates Bomber Jacket">
            <div class="overlay">
              <button class="add-btn" onclick="addToCart(3,'Emirates Bomber Jacket',1499,'https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800')">Add to Cart</button>
            </div>
          </div>
          <div class="info">
            <div class="info-top"><h3>Emirates Bomber Jacket</h3><p class="price">R1499</p></div>
            <button class="mobile-add" onclick="addToCart(3,'Emirates Bomber Jacket',1499,'https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800')">Add to Cart</button>
          </div>
        </div>
      </div>
    </section>

    <section class="category" id="pants">
      <div class="category-title"><h2>Pants</h2><div class="line"></div></div>
      <div class="products">
        <div class="product-card">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800" alt="Sahara Cargo Pants">
            <div class="overlay">
              <button class="add-btn" onclick="addToCart(4,'Sahara Cargo Pants',799,'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800')">Add to Cart</button>
            </div>
          </div>
          <div class="info">
            <div class="info-top"><h3>Sahara Cargo Pants</h3><p class="price">R799</p></div>
            <button class="mobile-add" onclick="addToCart(4,'Sahara Cargo Pants',799,'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800')">Add to Cart</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/cart-modal.js"></script>
  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      const isOpen = mobileMenu.style.display === 'flex';
      mobileMenu.style.display = isOpen ? 'none' : 'flex';
      hamburger.textContent = isOpen ? '☰' : '✕';
    });
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => { mobileMenu.style.display = 'none'; hamburger.textContent = '☰'; });
    });
  </script>
</body>
</html>
