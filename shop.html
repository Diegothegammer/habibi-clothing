<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - HABIBI CLOTHING</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; --gray: #1f1f1f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--black); color: var(--white); overflow-x: hidden; }

    header {
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #333;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.95rem; }

    .nav-right { display: flex; align-items: center; gap: 16px; }

    .cart-link {
      color: white;
      font-size: 1.35rem;
      position: relative;
      text-decoration: none;
      padding: 6px;
    }

    #cart-count {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #c41e3a;
      color: white;
      font-size: 0.7rem;
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      padding: 0 4px;
    }

    .hamburger {
      display: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: white;
      background: none;
      border: none;
      padding: 8px;
      line-height: 1;
    }

    .section {
      padding: 40px 20px 70px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .shop-header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: 2px;
      font-weight: 600;
    }

    .product-count {
      font-size: 0.9rem;
      opacity: 0.6;
    }

    /* ===== DESKTOP PRODUCT GRID ===== */
    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .product-card {
      background: var(--gray);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }

    .img-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      background: #151515;
    }

    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .product-card:hover .img-wrap img {
      transform: scale(1.06);
    }

    /* Hover overlay with Add to Cart */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .product-card:hover .overlay {
      opacity: 1;
    }

    .overlay .add-btn {
      width: 100%;
      max-width: 200px;
      background: white;
      color: black;
      padding: 13px 16px;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transform: translateY(12px);
      transition: transform 0.3s ease;
    }

    .product-card:hover .overlay .add-btn {
      transform: translateY(0);
    }

    .info {
      padding: 16px 14px 18px;
      text-align: left;
    }

    .info h3 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Mobile always-visible button (hidden on desktop) */
    .mobile-add {
      display: none;
      width: 100%;
      background: white;
      color: black;
      padding: 12px;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 57px;
      left: 0;
      width: 100%;
      background: #141414;
      padding: 24px 20px 32px;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
      border-top: 1px solid #333;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .mobile-menu a {
      color: white;
      text-decoration: none;
      font-size: 1.15rem;
      padding: 14px 12px;
      border-radius: 10px;
      font-weight: 500;
    }
    .mobile-menu a:active { background: #222; }

    /* ===== TABLET ===== */
    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: block; }

      .section {
        padding: 28px 14px 50px;
      }

      .shop-header {
        margin-bottom: 22px;
      }

      /* Single column on mobile for better product view */
      .products {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .product-card {
        border-radius: 14px;
      }

      .product-card:hover {
        transform: none;
        box-shadow: none;
      }

      .img-wrap {
        aspect-ratio: 4 / 5;
      }

      .product-card:hover .img-wrap img {
        transform: none;
      }

      /* Hide hover overlay on mobile */
      .overlay {
        display: none;
      }

      .info {
        padding: 14px 14px 16px;
        display: flex;
        flex-direction: column;
      }

      .info-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .info h3 {
        font-size: 1.05rem;
        flex: 1;
      }

      .price {
        font-size: 1.2rem;
        white-space: nowrap;
      }

      .mobile-add {
        display: block;
      }
    }

    /* Very small phones */
    @media (max-width: 380px) {
      .img-wrap {
        aspect-ratio: 3 / 4;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">HABIBI</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="cart-link">
          🛒
          <span id="cart-count">0</span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <div class="section">
    <div class="shop-header">
      <h1>Shop</h1>
      <span class="product-count">4 products</span>
    </div>

    <div class="products">

      <!-- Product 1 -->
      <div class="product-card">
        <div class="img-wrap">
          <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg" alt="Habibi Fresh Cap">
          <div class="overlay">
            <button class="add-btn" onclick="addToCart(1, 'Habibi Fresh Cap', 899, 'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg')">Add to Cart</button>
          </div>
        </div>
        <div class="info">
          <div class="info-top">
            <h3>Habibi Fresh Cap</h3>
            <p class="price">R899</p>
          </div>
          <button class="mobile-add" onclick="addToCart(1, 'Habibi Fresh Cap', 899, 'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa81cd795457.83783842_OCWw9.jpg')">Add to Cart</button>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <div class="img-wrap">
          <img src="https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg" alt="Signature Logo Tee">
          <div class="overlay">
            <button class="add-btn" onclick="addToCart(2, 'Signature Logo Tee', 449, 'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg')">Add to Cart</button>
          </div>
        </div>
        <div class="info">
          <div class="info-top">
            <h3>Signature Logo Tee</h3>
            <p class="price">R449</p>
          </div>
          <button class="mobile-add" onclick="addToCart(2, 'Signature Logo Tee', 449, 'https://d1yei2z3i6k35z.cloudfront.net/11623554/69fa7e5591c840.37735287_ooFb51.jpg')">Add to Cart</button>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="product-card">
        <div class="img-wrap">
          <img src="https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800" alt="Emirates Bomber Jacket">
          <div class="overlay">
            <button class="add-btn" onclick="addToCart(3, 'Emirates Bomber Jacket', 1499, 'https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800')">Add to Cart</button>
          </div>
        </div>
        <div class="info">
          <div class="info-top">
            <h3>Emirates Bomber Jacket</h3>
            <p class="price">R1499</p>
          </div>
          <button class="mobile-add" onclick="addToCart(3, 'Emirates Bomber Jacket', 1499, 'https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800')">Add to Cart</button>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="product-card">
        <div class="img-wrap">
          <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800" alt="Sahara Cargo Pants">
          <div class="overlay">
            <button class="add-btn" onclick="addToCart(4, 'Sahara Cargo Pants', 799, 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800')">Add to Cart</button>
          </div>
        </div>
        <div class="info">
          <div class="info-top">
            <h3>Sahara Cargo Pants</h3>
            <p class="price">R799</p>
          </div>
          <button class="mobile-add" onclick="addToCart(4, 'Sahara Cargo Pants', 799, 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800')">Add to Cart</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      const isOpen = mobileMenu.style.display === 'flex';
      mobileMenu.style.display = isOpen ? 'none' : 'flex';
      hamburger.textContent = isOpen ? '☰' : '✕';
    });

    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.style.display = 'none';
        hamburger.textContent = '☰';
      });
    });

    function addToCart(id, name, price, img) {
      let cart = JSON.parse(localStorage.getItem('habibiCart')) || [];
      cart.push({ id, name, price, img });
      localStorage.setItem('habibiCart', JSON.stringify(cart));
      alert(`${name} added to cart!`);
      updateCartCount();
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('habibiCart')) || [];
      document.getElementById('cart-count').textContent = cart.length;
    }

    window.onload = updateCartCount;
  </script>
</body>
</html>
