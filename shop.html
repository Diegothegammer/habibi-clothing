<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - HABIBI CLOTHING</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; --gray: #1f1f1f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--black); color: var(--white); overflow-x: hidden; }
    header {
      background: rgba(10,10,10,0.97); backdrop-filter: blur(12px);
      padding: 14px 16px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333;
    }
    .nav-container {
      max-width: 1300px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 5vw, 2.3rem); letter-spacing: 2px; }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .cart-link { color: white; font-size: 1.35rem; position: relative; text-decoration: none; padding: 6px; }
    #cart-count {
      position: absolute; top: -4px; right: -6px; background: #c41e3a; color: white;
      font-size: 0.7rem; min-width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: 700; padding: 0 4px;
    }
    .hamburger { display: none; font-size: 1.6rem; cursor: pointer; color: white; background: none; border: none; padding: 8px; }
    .section { padding: 32px 20px 70px; max-width: 1200px; margin: 0 auto; }
    .shop-header h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: 2px; margin-bottom: 6px; }
    .product-count { font-size: 0.9rem; opacity: 0.55; }
    .cat-nav {
      display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 40px;
      position: sticky; top: 58px; z-index: 50;
      background: rgba(10,10,10,0.92); backdrop-filter: blur(10px);
      padding: 12px 0; border-bottom: 1px solid #222;
    }
    .cat-nav a {
      color: white; text-decoration: none; font-size: 0.85rem; font-weight: 500;
      padding: 8px 16px; border: 1px solid #444; border-radius: 50px;
    }
    .cat-nav a:hover { background: white; color: black; }
    .category { margin-bottom: 56px; scroll-margin-top: 120px; }
    .category-title { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .category-title h2 {
      font-size: clamp(1.25rem, 3.5vw, 1.6rem); font-weight: 600;
      letter-spacing: 3px; text-transform: uppercase; white-space: nowrap;
    }
    .category-title .line { flex: 1; height: 1px; background: linear-gradient(to right, #444, transparent); }
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .product-card {
      background: var(--gray); border-radius: 12px; overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .product-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.45); }
    .img-wrap {
      position: relative; overflow: hidden; aspect-ratio: 3 / 4; background: #151515;
      cursor: pointer;
    }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stock-badge {
      position: absolute; top: 10px; left: 10px; font-size: 0.7rem; font-weight: 600;
      padding: 4px 10px; border-radius: 50px; background: rgba(0,0,0,0.7); z-index: 2;
    }
    .stock-badge.out { background: #5a1520; color: #ff8a95; }
    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: flex-end; justify-content: center; padding: 20px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .product-card:hover .overlay { opacity: 1; }
    .overlay .add-btn { pointer-events: auto; }
    .overlay .add-btn, .mobile-add {
      width: 100%; max-width: 200px; background: white; color: black; padding: 13px 16px;
      border: none; border-radius: 50px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
    }
    .overlay .add-btn:disabled, .mobile-add:disabled { opacity: 0.45; cursor: not-allowed; }
    .info { padding: 16px 14px 18px; }
    .info h3 { font-size: 1rem; font-weight: 500; margin-bottom: 6px; }
    .price { font-size: 1.15rem; font-weight: 600; }
    .mobile-add { display: none; margin-top: 12px; width: 100%; max-width: none; }
    .empty-cat { opacity: 0.4; padding: 12px 0; }
    .shop-loading { text-align: center; padding: 60px 20px; opacity: 0.6; }
    .mobile-menu {
      display: none; position: fixed; top: 57px; left: 0; width: 100%; background: #141414;
      padding: 24px 20px 32px; flex-direction: column; gap: 8px; z-index: 999; border-top: 1px solid #333;
    }
    .mobile-menu a { color: white; text-decoration: none; font-size: 1.15rem; padding: 14px 12px; }

    /* Product detail popup */
    #productModal {
      display: none; position: fixed; inset: 0; z-index: 10000;
      align-items: flex-end; justify-content: center;
    }
    #productModal.open { display: flex; }
    .pm-backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
    }
    .pm-sheet {
      position: relative; width: 100%; max-width: 440px; max-height: 92vh;
      background: #141414; border-radius: 20px 20px 0 0; border: 1px solid #333; border-bottom: none;
      overflow: auto; padding-bottom: 24px; animation: pmUp 0.28s ease;
    }
    @keyframes pmUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .pm-close {
      position: absolute; top: 12px; right: 12px; z-index: 5;
      background: rgba(0,0,0,0.55); border: none; color: white; width: 36px; height: 36px;
      border-radius: 50%; font-size: 1.1rem; cursor: pointer;
    }
    .pm-img-wrap {
      position: relative; aspect-ratio: 3 / 4; background: #0d0d0d; overflow: hidden;
    }
    .pm-img-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .pm-side-tabs {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; background: rgba(0,0,0,0.65); padding: 4px;
      border-radius: 50px; border: 1px solid #333;
    }
    .pm-side-tabs button {
      border: none; background: transparent; color: #aaa; padding: 8px 16px;
      border-radius: 50px; font-family: inherit; font-size: 0.8rem; font-weight: 600;
      cursor: pointer;
    }
    .pm-side-tabs button.active { background: white; color: black; }
    .pm-body { padding: 18px 20px 0; }
    .pm-body h2 { font-size: 1.25rem; margin-bottom: 4px; }
    .pm-price { font-size: 1.3rem; font-weight: 600; margin-bottom: 16px; }
    .pm-label {
      font-size: 0.75rem; opacity: 0.55; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 10px;
    }
    .pm-colors { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .pm-swatch {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; position: relative; padding: 0;
    }
    .pm-swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px #000; }
    .pm-swatch span {
      position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; white-space: nowrap; opacity: 0.7;
    }
    .pm-colors { margin-bottom: 36px; }
    .pm-add {
      width: 100%; padding: 15px; background: white; color: black; border: none;
      border-radius: 50px; font-weight: 600; font-size: 1.05rem; cursor: pointer;
      font-family: inherit;
    }
    .pm-add:disabled { opacity: 0.45; cursor: not-allowed; }
    .pm-stock { font-size: 0.85rem; opacity: 0.55; margin-top: 10px; text-align: center; }

    @media (min-width: 600px) {
      #productModal { align-items: center; }
      .pm-sheet {
        border-radius: 16px; border: 1px solid #333; margin: 16px; max-height: 90vh;
      }
    }
    @media (max-width: 900px) { .products { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .products { grid-template-columns: 1fr; }
      .overlay { display: none; }
      .mobile-add { display: block; }
      .info-top { display: flex; justify-content: space-between; gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">HABIBI</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="cart-link">🛒<span id="cart-count">0</span></a>
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <div class="section">
    <div class="shop-header">
      <h1>Shop</h1>
      <span class="product-count" id="productCount">Loading...</span>
    </div>
    <nav class="cat-nav">
      <a href="#hats">Hats</a>
      <a href="#tshirts">T-Shirts</a>
      <a href="#hoodies">Hoodies</a>
      <a href="#pants">Pants</a>
    </nav>
    <div id="shopRoot">
      <p class="shop-loading">Loading products...</p>
    </div>
  </div>

  <!-- Product detail modal -->
  <div id="productModal">
    <div class="pm-backdrop" id="pmBackdrop"></div>
    <div class="pm-sheet">
      <button type="button" class="pm-close" id="pmClose" aria-label="Close">✕</button>
      <div class="pm-img-wrap">
        <img id="pmImg" src="" alt="">
        <div class="pm-side-tabs">
          <button type="button" class="active" data-side="front">Front</button>
          <button type="button" data-side="back">Back</button>
        </div>
      </div>
      <div class="pm-body">
        <h2 id="pmName"></h2>
        <p class="pm-price" id="pmPrice"></p>
        <p class="pm-label">Colour</p>
        <div class="pm-colors" id="pmColors"></div>
        <button type="button" class="pm-add" id="pmAdd">Add to Cart</button>
        <p class="pm-stock" id="pmStock"></p>
      </div>
    </div>
  </div>

  <script src="js/cart-modal.js"></script>
  <script type="module">
    import { getActiveProducts, seedProductsIfEmpty } from "./js/firebase.js";

    const COLORS = [
      { id: "black", label: "Black", hex: "#0a0a0a", border: "#555" },
      { id: "white", label: "White", hex: "#f5f5f5", border: "#ccc" },
      { id: "dark-blue", label: "Dark Blue", hex: "#1a2744", border: "#3a5080" }
    ];

    let productMap = {};
    let current = null; // { product, side, color }

    const hamburger = document.getElementById("hamburger");
    const mobileMenu = document.getElementById("mobileMenu");
    hamburger.addEventListener("click", () => {
      const isOpen = mobileMenu.style.display === "flex";
      mobileMenu.style.display = isOpen ? "none" : "flex";
      hamburger.textContent = isOpen ? "☰" : "✕";
    });
    mobileMenu.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        mobileMenu.style.display = "none";
        hamburger.textContent = "☰";
      });
    });

    const CAT_META = {
      hats: { id: "hats", title: "Hats" },
      tshirts: { id: "tshirts", title: "T-Shirts" },
      hoodies: { id: "hoodies", title: "Hoodies & Outerwear" },
      pants: { id: "pants", title: "Pants" }
    };

    function esc(s) {
      return String(s || "").replace(/'/g, "\\'");
    }

    function cardHtml(p) {
      const stock = Number(p.stock) || 0;
      const out = stock <= 0;
      const img = p.img || "";
      const btn = out
        ? `<button class="add-btn" disabled>Out of stock</button>`
        : `<button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}','${esc(p.name)}',${p.price},'${img}')">Add to Cart</button>`;
      const mbtn = out
        ? `<button class="mobile-add" disabled>Out of stock</button>`
        : `<button class="mobile-add" onclick="addToCart('${p.id}','${esc(p.name)}',${p.price},'${img}')">Add to Cart</button>`;

      return `
        <div class="product-card">
          <div class="img-wrap" data-open="${p.id}" title="View details">
            <img src="${img}" alt="${p.name}" onerror="this.style.opacity=0.3">
            <span class="stock-badge ${out ? "out" : ""}">${out ? "Sold out" : stock + " left"}</span>
            <div class="overlay">${btn}</div>
          </div>
          <div class="info">
            <div class="info-top">
              <h3>${p.name}</h3>
              <p class="price">R${p.price}</p>
            </div>
            ${mbtn}
          </div>
        </div>`;
    }

    function updateModalImage() {
      if (!current) return;
      const p = current.product;
      const front = p.img || "";
      const back = p.imgBack || p.img || front;
      document.getElementById("pmImg").src = current.side === "back" ? back : front;
    }

    function openProduct(id) {
      const p = productMap[id];
      if (!p) return;
      current = { product: p, side: "front", color: "black" };

      document.getElementById("pmName").textContent = p.name;
      document.getElementById("pmPrice").textContent = "R" + p.price;
      const stock = Number(p.stock) || 0;
      document.getElementById("pmStock").textContent =
        stock <= 0 ? "Sold out" : stock + " in stock";

      document.querySelectorAll(".pm-side-tabs button").forEach((b) => {
        b.classList.toggle("active", b.dataset.side === "front");
      });

      const colorsEl = document.getElementById("pmColors");
      colorsEl.innerHTML = "";
      COLORS.forEach((c, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pm-swatch" + (i === 0 ? " selected" : "");
        btn.style.background = c.hex;
        btn.style.borderColor = i === 0 ? "#fff" : c.border;
        btn.dataset.color = c.id;
        btn.innerHTML = `<span>${c.label}</span>`;
        btn.addEventListener("click", () => {
          colorsEl.querySelectorAll(".pm-swatch").forEach((s) => {
            s.classList.remove("selected");
            const col = COLORS.find((x) => x.id === s.dataset.color);
            s.style.borderColor = col ? col.border : "#555";
          });
          btn.classList.add("selected");
          btn.style.borderColor = "#fff";
          current.color = c.id;
          // Later: switch image per colour when you add colour-specific photos
        });
        colorsEl.appendChild(btn);
      });

      const addBtn = document.getElementById("pmAdd");
      addBtn.disabled = stock <= 0;
      addBtn.textContent = stock <= 0 ? "Out of stock" : "Add to Cart";

      updateModalImage();
      document.getElementById("productModal").classList.add("open");
    }

    function closeProduct() {
      document.getElementById("productModal").classList.remove("open");
      current = null;
    }

    document.getElementById("pmBackdrop").addEventListener("click", closeProduct);
    document.getElementById("pmClose").addEventListener("click", closeProduct);

    document.querySelectorAll(".pm-side-tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!current) return;
        current.side = btn.dataset.side;
        document.querySelectorAll(".pm-side-tabs button").forEach((b) => {
          b.classList.toggle("active", b === btn);
        });
        updateModalImage();
      });
    });

    document.getElementById("pmAdd").addEventListener("click", () => {
      if (!current || (Number(current.product.stock) || 0) <= 0) return;
      const p = current.product;
      const colorLabel = (COLORS.find((c) => c.id === current.color) || COLORS[0]).label;
      // Open existing cart modal with preselected colour by pushing directly then toast,
      // or use addToCart then user picks again — better: push with colour
      const cart = JSON.parse(localStorage.getItem("habibiCart") || "[]");
      const existing = cart.find((i) => i.id === p.id && i.color === colorLabel);
      if (existing) {
        existing.qty = (existing.qty || 1) + 1;
      } else {
        cart.push({
          id: p.id,
          name: p.name,
          price: p.price,
          img: p.img,
          color: colorLabel,
          qty: 1
        });
      }
      localStorage.setItem("habibiCart", JSON.stringify(cart));
      if (typeof window.updateCartCount === "function") window.updateCartCount();
      closeProduct();
      const toast = document.createElement("div");
      toast.textContent = p.name + " (" + colorLabel + ") added";
      toast.style.cssText =
        "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 24px;border-radius:50px;font-weight:600;z-index:10001;font-size:0.95rem;";
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1600);
    });

    async function loadShop() {
      const root = document.getElementById("shopRoot");
      try {
        await seedProductsIfEmpty();
        const products = await getActiveProducts();
        productMap = {};
        products.forEach((p) => {
          productMap[p.id] = p;
        });

        document.getElementById("productCount").textContent =
          products.length + " product" + (products.length === 1 ? "" : "s");

        let html = "";
        for (const key of Object.keys(CAT_META)) {
          const meta = CAT_META[key];
          const items = products.filter(
            (p) => (p.category || "tshirts").toLowerCase() === key
          );
          html += `
            <section class="category" id="${meta.id}">
              <div class="category-title"><h2>${meta.title}</h2><div class="line"></div></div>
              <div class="products">
                ${items.length ? items.map(cardHtml).join("") : '<p class="empty-cat">No items in this category yet.</p>'}
              </div>
            </section>`;
        }

        const known = new Set(Object.keys(CAT_META));
        const other = products.filter((p) => !known.has((p.category || "").toLowerCase()));
        if (other.length) {
          html += `
            <section class="category" id="other">
              <div class="category-title"><h2>More</h2><div class="line"></div></div>
              <div class="products">${other.map(cardHtml).join("")}</div>
            </section>`;
        }

        root.innerHTML = html || '<p class="shop-loading">No products yet. Add some in Admin.</p>';

        root.querySelectorAll("[data-open]").forEach((el) => {
          el.addEventListener("click", (e) => {
            if (e.target.closest(".add-btn")) return;
            openProduct(el.dataset.open);
          });
        });
      } catch (err) {
        console.error(err);
        root.innerHTML =
          '<p class="shop-loading">Could not load products.<br><br>' +
          (err.message || "") +
          "</p>";
      }
    }

    loadShop();
  </script>
</body>
</html>
