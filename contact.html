<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - HABIBI CLOTHING</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
    :root { --black: #0a0a0a; --white: #f8f8f8; --gray: #1f1f1f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
    }
    header {
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #333;
    }
    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .cart-link {
      color: white;
      font-size: 1.35rem;
      position: relative;
      text-decoration: none;
      padding: 6px;
    }
    #cart-count {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #c41e3a;
      color: white;
      font-size: 0.7rem;
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      padding: 0 4px;
    }
    .hamburger {
      display: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: white;
      background: none;
      border: none;
      padding: 8px;
      line-height: 1;
    }
    .contact-container {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 18px 70px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 3rem);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      opacity: 0.75;
      margin-bottom: 36px;
    }
    .contact-form {
      background: var(--gray);
      border-radius: 16px;
      padding: 28px 22px;
      border: 1px solid #333;
      text-align: left;
    }
    .contact-form label {
      display: block;
      font-size: 0.8rem;
      opacity: 0.6;
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .contact-form .field { margin-bottom: 16px; }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 13px 14px;
      background: #111;
      border: 1px solid #444;
      color: white;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .contact-form textarea {
      min-height: 130px;
      resize: vertical;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: #888;
    }
    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: white;
      color: black;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .form-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
    }
    .form-msg.ok { color: #6bffb0; display: block; }
    .form-msg.err { color: #ff8a95; display: block; }
    .mobile-menu {
      display: none;
      position: fixed;
      top: 57px;
      left: 0;
      width: 100%;
      background: #141414;
      padding: 24px 20px 32px;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
      border-top: 1px solid #333;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .mobile-menu a {
      color: white;
      text-decoration: none;
      font-size: 1.15rem;
      padding: 14px 12px;
      border-radius: 10px;
      font-weight: 500;
    }
    footer {
      background: #000;
      text-align: center;
      padding: 40px 20px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    footer a { color: #aaa; text-decoration: none; margin: 0 10px; font-size: 0.85rem; }
    footer a:hover { color: white; opacity: 1; }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .contact-form { padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">HABIBI</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="cart-link">🛒<span id="cart-count">0</span></a>
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <div class="contact-container">
    <h1>Get In Touch</h1>
    <p class="subtitle">We'd love to hear from you. Send us a message.</p>

    <form class="contact-form" id="contactForm">
      <div class="field">
        <label for="cName">Full name</label>
        <input type="text" id="cName" name="name" required placeholder="Your name" autocomplete="name">
      </div>
      <div class="field">
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="cPhone">Phone (optional)</label>
        <input type="tel" id="cPhone" name="phone" placeholder="+27 ..." autocomplete="tel">
      </div>
      <div class="field">
        <label for="cMessage">Message</label>
        <textarea id="cMessage" name="message" required placeholder="How can we help?"></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
      <p class="form-msg" id="formMsg"></p>
    </form>
  </div>

  <footer>
    <p>© 2026 Habibi Clothing • Pretoria, South Africa</p>
    <p style="margin-top:12px">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms & Conditions</a>
    </p>
  </footer>

  <script type="module">
    import { submitContactMessage } from "./js/firebase.js";

    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      const isOpen = mobileMenu.style.display === 'flex';
      mobileMenu.style.display = isOpen ? 'none' : 'flex';
      hamburger.textContent = isOpen ? '☰' : '✕';
    });
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.style.display = 'none';
        hamburger.textContent = '☰';
      });
    });

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('habibiCart') || '[]');
      const el = document.getElementById('cart-count');
      if (el) el.textContent = cart.reduce((s, i) => s + (i.qty || 1), 0);
    }
    updateCartCount();

    const form = document.getElementById('contactForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('formMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'form-msg';
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const name = document.getElementById('cName').value.trim();
      const email = document.getElementById('cEmail').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const message = document.getElementById('cMessage').value.trim();

      try {
        await submitContactMessage({ name, email, phone, message });
        form.reset();
        msg.className = 'form-msg ok';
        msg.textContent = 'Message sent. We will get back to you soon.';
      } catch (err) {
        console.error(err);
        msg.className = 'form-msg err';
        msg.textContent = 'Could not send. Please try again. ' + (err.message || '');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Message';
      }
    });
  </script>
</body>
</html>
